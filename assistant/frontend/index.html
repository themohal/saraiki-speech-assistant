<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: transparent;
  }
  #ptt {
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    cursor: pointer;
    width: 100%;
    max-width: 460px;
    padding: 20px 24px;
    border: none;
    border-radius: 999px;
    font-size: 1.06rem;
    font-weight: 650;
    letter-spacing: .2px;
    color: #fff;
    background: linear-gradient(135deg, #2f7d5d 0%, #1f5f46 100%);
    box-shadow: 0 6px 18px rgba(31, 95, 70, .32);
    transition: transform .12s ease, box-shadow .12s ease, background .2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #ptt:hover:not(.recording):not(:disabled) { transform: translateY(-1px); }
  #ptt.recording {
    background: linear-gradient(135deg, #c9403f 0%, #97282a 100%);
    box-shadow: 0 0 0 8px rgba(201, 64, 63, .16), 0 6px 20px rgba(151, 40, 42, .38);
    transform: scale(.99);
  }
  #ptt:disabled { opacity: .55; cursor: not-allowed; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: rgba(255,255,255,.9); flex: none;
  }
  #ptt.recording .dot { animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.72); } }
  #meter {
    width: 100%; max-width: 460px; height: 5px; border-radius: 999px;
    background: rgba(127,127,127,.22); overflow: hidden;
  }
  #level { height: 100%; width: 0%; background: #c9403f; transition: width .07s linear; }
  #hint { font-size: .78rem; opacity: .65; min-height: 1.1em; text-align: center; }
  #hint.error { color: #c9403f; opacity: 1; font-weight: 600; }
</style>
</head>
<body>
  <button id="ptt" type="button"><span class="dot"></span><span id="label">Hold to speak</span></button>
  <div id="meter"><div id="level"></div></div>
  <div id="hint">Press and hold, speak, then release</div>

<script>
// ---- Streamlit component protocol (implemented directly, no npm build) ----
function send(msg) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
}
function setFrameHeight() {
  send({ type: "streamlit:setFrameHeight", height: document.body.scrollHeight + 8 });
}
function setComponentValue(value) {
  send({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
}

const TARGET_RATE = 16000;   // what Whisper wants
const MIN_MS = 350;

const btn = document.getElementById("ptt");
const label = document.getElementById("label");
const hint = document.getElementById("hint");
const level = document.getElementById("level");

let stream = null, audioCtx = null, source = null, processor = null, analyser = null;
let chunks = [], recording = false, counter = 0, startedAt = 0, rafId = null;

function say(text, isError) {
  hint.textContent = text;
  hint.classList.toggle("error", !!isError);
  setFrameHeight();
}

function drawLevel() {
  if (!analyser) return;
  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let peak = 0;
  for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
  level.style.width = Math.min(100, (peak / 128) * 260) + "%";
  rafId = requestAnimationFrame(drawLevel);
}

// ---- Encode raw PCM as a WAV file in the browser -------------------------
// Sending WAV instead of MediaRecorder's WebM/Opus means the server never
// needs ffmpeg -- libsndfile reads this directly.
function resample(input, srcRate, dstRate) {
  if (srcRate === dstRate || input.length === 0) return input;
  const ratio = srcRate / dstRate;
  const outLen = Math.max(1, Math.floor(input.length / ratio));
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const pos = i * ratio;
    const i0 = Math.floor(pos);
    const i1 = Math.min(i0 + 1, input.length - 1);
    out[i] = input[i0] + (input[i1] - input[i0]) * (pos - i0);
  }
  return out;
}

function encodeWav(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);        // PCM header size
  view.setUint16(20, 1, true);         // format = PCM
  view.setUint16(22, 1, true);         // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);  // byte rate
  view.setUint16(32, 2, true);         // block align
  view.setUint16(34, 16, true);        // bits per sample
  writeStr(36, "data");
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([view], { type: "audio/wav" });
}

async function startRecording() {
  if (recording) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say("This browser blocks microphone access (needs HTTPS or localhost).", true);
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (err) {
    say("Microphone blocked. Allow mic access in your browser, then retry.", true);
    return;
  }

  const Ctx = window.AudioContext || window.webkitAudioContext;
  try {
    // Ask for 16 kHz directly; browsers that refuse give us their own rate and
    // we resample on stop.
    audioCtx = new Ctx({ sampleRate: TARGET_RATE });
  } catch (e) {
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") { try { await audioCtx.resume(); } catch (e) {} }

  source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  source.connect(analyser);

  // ScriptProcessor is deprecated but universally available, and gives us the
  // raw float PCM we need without an AudioWorklet module file.
  processor = audioCtx.createScriptProcessor(4096, 1, 1);
  chunks = [];
  processor.onaudioprocess = (e) => {
    if (!recording) return;
    chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  source.connect(processor);
  // Keep the graph pulling without echoing the mic to the speakers.
  const mute = audioCtx.createGain();
  mute.gain.value = 0;
  processor.connect(mute);
  mute.connect(audioCtx.destination);

  recording = true;
  startedAt = Date.now();
  btn.classList.add("recording");
  label.textContent = "Recording... release to send";
  say("Listening");
  drawLevel();
}

function finalize() {
  const rate = audioCtx ? audioCtx.sampleRate : TARGET_RATE;

  let total = 0;
  for (const c of chunks) total += c.length;
  const flat = new Float32Array(total);
  let at = 0;
  for (const c of chunks) { flat.set(c, at); at += c.length; }
  chunks = [];

  // Tear the audio graph down.
  try { if (processor) { processor.disconnect(); processor.onaudioprocess = null; } } catch (e) {}
  try { if (source) source.disconnect(); } catch (e) {}
  try { if (audioCtx) audioCtx.close(); } catch (e) {}
  processor = source = analyser = audioCtx = null;
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }

  if (!flat.length) { say("Nothing was recorded, try again.", true); return; }

  const wav = encodeWav(resample(flat, rate, TARGET_RATE), TARGET_RATE);
  const reader = new FileReader();
  reader.onloadend = () => {
    counter += 1;
    setComponentValue({
      id: counter,
      audio_base64: String(reader.result).split(",")[1] || "",
      mime: "audio/wav",
      sample_rate: TARGET_RATE,
      size: wav.size,
    });
    say("Sent - generating reply");
  };
  reader.readAsDataURL(wav);
}

function stopRecording() {
  if (!recording) return;
  const held = Date.now() - startedAt;
  recording = false;
  btn.classList.remove("recording");
  label.textContent = "Hold to speak";
  say("Processing...");
  if (rafId) cancelAnimationFrame(rafId);
  level.style.width = "0%";
  // Let a very short tap capture at least a little audio before we cut it off.
  if (held < MIN_MS) setTimeout(finalize, MIN_MS - held);
  else finalize();
}

// Pointer events cover mouse, touch and pen with one code path.
btn.addEventListener("pointerdown", (e) => { e.preventDefault(); startRecording(); });
btn.addEventListener("pointerup", (e) => { e.preventDefault(); stopRecording(); });
btn.addEventListener("pointercancel", stopRecording);
btn.addEventListener("pointerleave", () => { if (recording) stopRecording(); });
btn.addEventListener("contextmenu", (e) => e.preventDefault());

// Hold the spacebar as a keyboard alternative.
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); startRecording(); }
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") { e.preventDefault(); stopRecording(); }
});

window.addEventListener("message", (event) => {
  if (event.data && event.data.type === "streamlit:render") setFrameHeight();
});

send({ type: "streamlit:componentReady", apiVersion: 1 });
setFrameHeight();
</script>
</body>
</html>
